<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Ollama AI Chat</title>
	<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/htmx-ext-sse@2.2.4"></script>
	<style>
		body {
			font-family: Arial, sans-serif;
			background: #f7f8fb;
			color: #111;
			margin: 0;
			padding: 0;
		}
		main {
			max-width: 720px;
			margin: 3rem auto;
			padding: 1.5rem;
			background: #fff;
			box-shadow: 0 18px 42px rgba(0, 0, 0, 0.08);
			border-radius: 16px;
		}
		h1 {
			margin-top: 0;
		}
		textarea {
			width: 100%;
			border: 1px solid #d6d8e0;
			border-radius: 10px;
			padding: 1rem;
			font-size: 1rem;
			resize: vertical;
		}
		button {
			border: none;
			background: #4f46e5;
			color: white;
			padding: 0.9rem 1.4rem;
			border-radius: 10px;
			font-size: 1rem;
			cursor: pointer;
		}
		button:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}
		.response-output {
			margin-top: 1.5rem;
			padding: 1rem;
			min-height: 140px;
			border: 1px solid #e1e3eb;
			border-radius: 12px;
			background: #f8fafc;
			white-space: pre-wrap;
		}
	</style>
</head>
<body>
	<main>
		<h1>Ollama AI Chat</h1>
		<p>Ask the local model a question and watch the answer stream back word by word.</p>

		<form id="chat-form">
			<textarea name="prompt" rows="5" placeholder="Type your prompt here..." required></textarea>
			<div style="margin-top: 1rem; display: flex; gap: 0.75rem; align-items: center;">
				<button type="submit">Send</button>
				<span id="status">Ready</span>
			</div>
		</form>

		<div id="sse-container" hx-ext="sse" sse-swap="message" hx-swap="beforeend" sse-close="done"></div>
	</main>

	<script>
		const form = document.getElementById('chat-form');
		const status = document.getElementById('status');
		const sseContainer = document.getElementById('sse-container');

		form.addEventListener('submit', function (event) {
			event.preventDefault();

			const prompt = form.prompt.value.trim();
			if (!prompt) {
				return;
			}

			status.textContent = 'Streaming...';
			sseContainer.textContent = '';
			sseContainer.setAttribute('sse-connect', '/chat?prompt=' + encodeURIComponent(prompt));
			sseContainer.setAttribute('sse-close', 'done');
			htmx.process(sseContainer);
		});
	</script>
</body>
</html>
